name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-southeast2
  SERVICE_NAME: kira-app
  IMAGE_NAME: kira-app

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Autentikasi ke Google Cloud
      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      # 2. Persiapan Node.js & Prisma Migration
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run Prisma Migration
        run: |
          npm install
          npx prisma db push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # 3. Konfigurasi Docker & Build Image
      - name: Configure Docker
        run: gcloud auth configure-docker asia-southeast2-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          docker build -t asia-southeast2-docker.pkg.dev/$PROJECT_ID/kira-repo/$IMAGE_NAME:latest .
          docker push asia-southeast2-docker.pkg.dev/$PROJECT_ID/kira-repo/$IMAGE_NAME:latest

      # 4. Deploy ke Cloud Run
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image asia-southeast2-docker.pkg.dev/$PROJECT_ID/kira-repo/$IMAGE_NAME:latest \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --memory 2Gi \
            --cpu 2 \
            --min-instances 1 \
            --set-secrets="DATABASE_URL=DATABASE_URL:latest,CLERK_SECRET_KEY=CLERK_SECRET_KEY:latest" \
            --set-env-vars="NODE_ENV=production,NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.CLERK_PUB_KEY }}"
